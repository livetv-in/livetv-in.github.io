<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live TV</title>
  <meta name="app-country" content="IN">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar bg-white border-bottom sticky-top">
    <div class="container">
      <a id="appName" class="navbar-brand fw-bold" href="#">Live TV</a>
    </div>
  </nav>

  <main class="container py-4">
    <section id="channelView">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
          <h1 id="channelHeading" class="h4 mb-1">Live channels</h1>
          <p id="channelCount" class="text-secondary small mb-0">Loading channels...</p>
        </div>
      </div>
      <div class="d-flex flex-column gap-2 mb-3">
        <input id="searchInput" class="form-control channel-search" type="search" placeholder="Search channels">
        <div id="categoryFilters" class="d-flex gap-2 overflow-auto pb-2"></div>
      </div>
      <div id="channelGrid" class="row g-3"></div>
    </section>

    <section id="playerView" class="d-none">
      <button id="backButton" class="btn btn-light border mb-3" type="button">&larr; Back</button>
      <div class="row g-4">
        <div class="col-lg-9">
          <div class="player-wrap">
            <video id="video" class="w-100" controls playsinline></video>
            <div id="playerMessage" class="player-message d-none"></div>
          </div>
          <div class="d-flex align-items-start justify-content-between mt-3">
            <div>
              <h1 id="playerTitle" class="h4 mb-1"></h1>
              <p id="playerMeta" class="text-secondary mb-0"></p>
            </div>
            <button id="watchlistButton" class="btn btn-outline-primary" type="button">Add to watchlist</button>
          </div>
        </div>
        <aside class="col-lg-3">
          <h2 class="h6 mb-3">Other channels</h2>
          <div id="sideList" class="side-list"></div>
        </aside>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
